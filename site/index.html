<!doctype html>
<html lang="en" data-theme="core" data-viewport="desktop">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ap_codegrid</title>

  <!-- ap-ds-storybook tier 1/2/3 tokens + the TWK Lausanne webfont, served
       via jsDelivr off the published npm package -- this page is plain
       static HTML with no npm/build step (no package.json here), so a
       local import isn't an option.

       build/all-combinations/css/variables.css (not tier_1_core) because
       this page uses the "core_dark" theme: tier_1_core only ever bakes
       ONE resolved set of values (the light "core" theme) straight onto
       a plain :root, with no dark variant to switch to. all-combinations
       has every theme x viewport combination, but each one only resolves
       inside its own [data-theme="..."][data-viewport="..."] attribute
       selector -- normally kept in sync by <ViewportSync /> in a real
       app, which this static page has no React runtime to mount.
       styles/viewport-sync.js below (v1.2.5+) is that same component's
       vanilla-JS sibling, so data-viewport now tracks the real window
       width here too, same as it would in a React app -- the
       data-viewport value on <html> is just the initial/no-JS fallback,
       overwritten the instant that script runs. None of the
       var(--ap-tier-2-...)/var(--ap-tier-3-...) references further down
       changed at all; they just resolve against core_dark's values now
       instead of core's. Pin the version in all three URLs below when
       ap-ds-storybook publishes a newer one. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ap-ds-storybook@1.2.5/assets/fonts/twk-lausanne/twk-lausanne.css" />
  <!-- Basil (Basier Circle/Square/Square Mono) + Molasses (Nudica/Quablo/
       Bricolage Grotesque) webfonts. Without these, the browser falls back
       to the locally installed Basier copies, which render as tofu boxes. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ap-ds-storybook@1.2.5/assets/fonts/basier-circle/basier-circle.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ap-ds-storybook@1.2.5/assets/fonts/basier-square/basier-square.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ap-ds-storybook@1.2.5/assets/fonts/basier-square-mono/basier-square-mono.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ap-ds-storybook@1.2.5/assets/fonts/nudica/nudica.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ap-ds-storybook@1.2.5/assets/fonts/quablo/quablo.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ap-ds-storybook@1.2.5/assets/fonts/bricolage-grotesque/bricolage-grotesque.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ap-ds-storybook@1.2.5/build/all-combinations/css/variables.css" />
  <script src="https://cdn.jsdelivr.net/npm/ap-ds-storybook@1.2.5/styles/viewport-sync.js"></script>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="ap_grid_container">
    <div class="ap_grid_1">
      <div class="cg_home_header_container">
        <div class="cg_home_header_text_container">
          <h1 class="cg_home_header_text">ap_codegrid</h1>
        </div>
        <div class="cg_home_subheader_text_container">
          <p class="cg_home_subheader_text">Practice versions and Original versions.</p>
        </div>
      </div>
    </div>
  </div>

  <div class="ap_grid_container">
    <div class="ap_grid_1 cg_home_project_list_wrapper">
      <div class="cg_home_project_list_container">

        <!-- Obsidian Projects Section  -->
        <div class="cg_home_project_item_container">
          <div class="cg_home_project_item_text_container">
            <a class="ap_link_with_underline" href="./obsidian/" data-local="http://localhost:3002/obsidian/">
              Obsidian Assembly, page transitions
            </a>
          </div>
          <div class="cg_home_project_item_text_container">
            <a class="ap_link_with_underline" href="./obsidian/cg_example/" data-local="http://localhost:3012/obsidian/cg_example/">
              Obsidian cg_example (original Codegrid starter)
            </a>
          </div>
        </div>
        
        <!-- Sticky Cards ProjectsSection -->
        <div class="cg_home_project_item_container">
          <div class="cg_home_project_item_text_container">
            <a class="ap_link_with_underline" href="./sticky-cards/" data-local="http://localhost:3000/sticky-cards/">
              Sticky Cards, page transitions
            </a>
          </div>
          <div class="cg_home_project_item_text_container">
            <a class="ap_link_with_underline variant" href="./sticky-cards/cg_example/" data-local="http://localhost:3010/sticky-cards/cg_example/">
              Sticky Cards (original Codegrid starter)
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>


  <script>
    if (location.hostname === "localhost" || location.hostname === "127.0.0.1") {
      document.querySelectorAll("a[data-local]").forEach(function (a) {
        a.href = a.getAttribute("data-local");
      });
      document.getElementById("local-note").hidden = false;
    }
  </script>
</body>
</html>
